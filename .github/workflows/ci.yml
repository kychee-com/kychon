name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The exact gate the release wrapper runs before tagging (build:sdk,
      # ui:architecture-check, seed smoke check, vitest, biome, astro check,
      # tsc scripts). Never re-list the sub-checks here; add them to the
      # `check` script in package.json so CI and releases cannot drift.
      - name: Check (npm run check)
        run: npm run check
