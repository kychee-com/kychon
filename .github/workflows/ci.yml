name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by run402-bump.yml (GITHUB_TOKEN pushes do not trigger push workflows).
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The exact gate the release wrapper runs before tagging (build:sdk,
      # ui:architecture-check, seed smoke check, vitest, biome, astro check,
      # tsc scripts). Never re-list the sub-checks here; add them to the
      # `check` script in package.json so CI and releases cannot drift.
      - name: Check (npm run check)
        run: npm run check
